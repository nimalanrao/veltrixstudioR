<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a304e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#05060a" stop-opacity="1"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Obsidian dark rounded background -->
  <rect width="128" height="128" rx="32" fill="url(#bgGlow)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.15"/>
  
  <!-- Subtle inner border ring -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Veltrix Stylized "V" Monogram + Crosshair Star -->
  <g filter="url(#glow)">
    <!-- Crosshair Accents -->
    <line x1="64" y1="18" x2="64" y2="30" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="64" y1="98" x2="64" y2="110" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="18" y1="64" x2="30" y2="64" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="98" y1="64" x2="110" y2="64" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Sharp Bold Geometric V Shape -->
    <path d="M36 38 L64 92 L92 38 L80 38 L64 74 L48 38 Z" fill="#ffffff"/>
    
    <!-- Central Bright Star Accent -->
    <polygon points="64,48 66.5,58 76.5,60.5 66.5,63 64,73 61.5,63 51.5,60.5 61.5,58" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
