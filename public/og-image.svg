<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#141829" stop-opacity="1"/>
      <stop offset="60%" stop-color="#080912" stop-opacity="1"/>
      <stop offset="100%" stop-color="#05060A" stop-opacity="1"/>
    </radialGradient>
    
    <!-- Outer Rim Glow -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  
  <!-- Subtle Grid Lines for High-tech Aesthetic -->
  <g stroke="#ffffff" stroke-width="1" stroke-opacity="0.04">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Inner Framed Border -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="url(#cardBorder)" stroke-width="1.5"/>

  <!-- Top Badge: Official Game Studio -->
  <g transform="translate(600, 110)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
    <text text-anchor="middle" y="6" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="3" text-transform="uppercase">
      ✦ OFFICIAL ROBLOX STUDIO ✦
    </text>
  </g>

  <!-- Main Brand Title -->
  <text x="600" y="235" text-anchor="middle" fill="#ffffff" font-family="'Big Shoulders Display', 'Arial Black', Impact, sans-serif" font-size="96" font-weight="900" letter-spacing="6" text-transform="uppercase" filter="url(#neonGlow)">
    VELTRIX STUDIO
  </text>

  <!-- Upcoming Title Subtitle -->
  <g transform="translate(600, 310)">
    <text text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="1">
      GROW A BRAINROT BABY!
    </text>
    <text text-anchor="middle" y="42" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">
      Playtests • Exclusive Launch Codes • Discord Community
    </text>
  </g>

  <!-- Bottom CTA Chips -->
  <g transform="translate(600, 475)">
    <!-- Discord Chip -->
    <g transform="translate(-240, 0)">
      <rect x="-90" y="-22" width="180" height="44" rx="22" fill="#5865F2" fill-opacity="0.2" stroke="#5865F2" stroke-opacity="0.5"/>
      <text text-anchor="middle" y="6" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1">
        DISCORD SERVER
      </text>
    </g>

    <!-- Roblox Group Chip -->
    <g transform="translate(0, 0)">
      <rect x="-90" y="-22" width="180" height="44" rx="22" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.3"/>
      <text text-anchor="middle" y="6" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1">
        ROBLOX GROUP
      </text>
    </g>

    <!-- Domain Chip -->
    <g transform="translate(240, 0)">
      <rect x="-90" y="-22" width="180" height="44" rx="22" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.2"/>
      <text text-anchor="middle" y="6" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1">
        VELTRIXSTUDIO.LOL
      </text>
    </g>
  </g>

  <!-- Corner Crosshair Accents -->
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <line x1="55" y1="55" x2="70" y2="55"/>
    <line x1="55" y1="55" x2="55" y2="70"/>
    
    <line x1="1145" y1="55" x2="1130" y2="55"/>
    <line x1="1145" y1="55" x2="1145" y2="70"/>

    <line x1="55" y1="575" x2="70" y2="575"/>
    <line x1="55" y1="575" x2="55" y2="560"/>

    <line x1="1145" y1="575" x2="1130" y2="575"/>
    <line x1="1145" y1="575" x2="1145" y2="560"/>
  </g>
</svg>
