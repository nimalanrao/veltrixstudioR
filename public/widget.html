<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veltrix Studio Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Big+Shoulders+Display:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: transparent;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      overflow: hidden;
    }
    .widget-card {
      width: 100%;
      max-width: 380px;
      background: rgba(12, 14, 24, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 25px rgba(255, 255, 255, 0.03);
      position: relative;
      overflow: hidden;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }
    .widget-card:hover {
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }
    .glow-orb {
      position: absolute;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
      top: -40px;
      right: -40px;
      pointer-events: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
    }
    .brand-title {
      font-family: 'Big Shoulders Display', Impact, sans-serif;
      font-size: 20px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 900;
      line-height: 1;
    }
    .badge-live {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      color: #4ade80;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 8px #4ade80;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .game-banner {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 16px;
    }
    .game-tag {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #94a3b8;
      font-weight: 700;
    }
    .game-title {
      font-size: 13px;
      font-weight: 800;
      color: #fff;
      margin-top: 2px;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-discord {
      background: rgba(88, 101, 242, 0.2);
      border: 1px solid rgba(88, 101, 242, 0.4);
      color: #fff;
    }
    .btn-discord:hover {
      background: #5865F2;
      border-color: #5865F2;
    }
    .btn-roblox {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
    }
    .btn-roblox:hover {
      background: #ffffff;
      color: #000;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 9px;
      color: #64748b;
    }
    .footer a {
      color: #94a3b8;
      text-decoration: none;
      font-weight: 600;
    }
    .footer a:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="widget-card">
    <div class="glow-orb"></div>
    <div class="header">
      <div class="brand">
        <div class="brand-icon">✦</div>
        <div class="brand-title">VELTRIX STUDIO</div>
      </div>
      <div class="badge-live">
        <span class="pulse-dot"></span>
        <span>LIVE HUB</span>
      </div>
    </div>

    <div class="game-banner">
      <div class="game-tag">UPCOMING ROBLOX GAME</div>
      <div class="game-title">Grow a Brainrot Baby!</div>
    </div>

    <div class="actions">
      <a href="https://discord.com" target="_blank" rel="noopener noreferrer" class="btn btn-discord">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
        </svg>
        <span>Discord</span>
      </a>
      <a href="https://www.roblox.com" target="_blank" rel="noopener noreferrer" class="btn btn-roblox">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
          <path d="M5.166 0L0 19.297l18.834 4.703 5.166-19.297L5.166 0zm9.467 14.512l-4.708-1.177 1.177-4.708 4.708 1.177-1.177 4.708z" />
        </svg>
        <span>Roblox</span>
      </a>
    </div>

    <div class="footer">
      <span>Official Veltrix Widget</span>
      <a href="https://veltrixstudio.lol" target="_blank">veltrixstudio.lol ↗</a>
    </div>
  </div>
</body>
</html>
